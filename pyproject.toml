[project]
name = "chronozarr"
version = "0.3.0"
description = "Zarr v3 convention and reader for raster time series with true stored values"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "James H. Gearon" }]
requires-python = ">=3.11"
keywords = [
    "zarr",
    "raster",
    "time series",
    "remote sensing",
    "sentinel-2",
    "earth observation",
    "xarray",
    "cloud-native",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "zarr>=3.1",
    "xarray>=2024.1",
    "click>=8.1",
]

[project.urls]
Homepage = "https://chronozarr.org"
Documentation = "https://github.com/chronozarr/chronozarr/blob/main/spec/CHRONOZARR.md"
Repository = "https://github.com/chronozarr/chronozarr"
Issues = "https://github.com/chronozarr/chronozarr/issues"

[project.optional-dependencies]
# rasterio: GeoTIFF/COG input for `convert`, `export-cog`, and the WGS84 extent for `stac`.
geo = ["rasterio>=1.3"]
# IPython: `chronozarr.view(store)` in notebooks.
notebook = ["ipython>=8", "anywidget>=0.9"]
# Leafmap MapLibre integration; sidebar-free examples work with ipyvuetify 3.
leafmap = ["leafmap>=0.63.1"]
# geemap MapLibre currently relies on geo/widget dependencies supplied by leafmap.
geemap = ["geemap>=0.37.2", "leafmap>=0.63.1"]
# dask: `chunks=` with the xarray backend and dask-backed input to `encode`.
dask = ["dask>=2024.1"]
# h5netcdf and h5py: NetCDF input for `convert` and `encode`.
netcdf = ["h5netcdf>=1.3", "h5py>=3.10"]
ingest = [
    "pystac>=1.10",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rasterio>=1.3",
    "pyyaml>=6.0",
]
dev = [
    "coverage>=7.6",
    "pytest>=8.0",
    "ruff>=0.5",
    "ty>=0.0.23",
]

[project.scripts]
chronozarr = "chronozarr.cli:main"

[project.entry-points."xarray.backends"]
chronozarr = "chronozarr.backend:ChronozarrBackendEntrypoint"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronozarr"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chronozarr", "tests", "spec", "README.md", "LICENSE", "pyproject.toml",
    "scripts/check_architecture.py", ".sentrux/rules.toml",
]

[tool.ruff]
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["chronozarr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "slow: marks tests that process real data",
    "unit: fast isolated tests",
]

[tool.coverage.run]
branch = true
source = ["chronozarr"]
data_file = "data/reports/coverage/python/.coverage"
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.json]
output = "data/reports/coverage/python/coverage.json"

[tool.coverage.xml]
output = "data/reports/coverage/python/coverage.xml"
